name: Build Kingdom Guard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y apksigner zipalign wget

      - name: Download Apktool 2.9.3
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar

      - name: Build APK (skip resource recompile - preserves original resources.arsc)
        run: |
          java -Xmx4g -jar apktool.jar b --no-res . -o Kingdom_Guard_unsigned.apk

      - name: Align APK
        run: |
          zipalign -v 4 Kingdom_Guard_unsigned.apk Kingdom_Guard_aligned.apk

      - name: Create Keystore and Sign APK
        run: |
          keytool -genkeypair -v -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out Kingdom_Guard_Signed.apk \
            Kingdom_Guard_aligned.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kingdom_Guard_APK
          path: Kingdom_Guard_Signed.apk
          retention-days: 7
